# Julius runtime configuration. Secrets never go here: put ANTHROPIC_API_KEY in .env (gitignored).

[identity]                  # the assistant's name, in one place (julius/identity.py)
name = "Julius"             # what it calls itself: prompts, spoken replies, cards, console lines
# display_name = "Julius"   # what a UI shows (the orb's title and speaker label); defaults to name
# wake_word = "Julius"      # what wakes it; defaults to name. A new wake word needs its own trained model for [wake] engine = "cascade"
                            # (until then it falls back to the Whisper wake). Data folders keep their names: renaming moves nothing.

[brain]
mode = "cloud"              # "cloud" (Haiku front end + Sonnet planner) or "local" (Ollama only)
max_tool_rounds = 3        # tool rounds Haiku may chain in one turn ("look up X, then chart it")
turn_max_usd = 0.15        # hard cap on one turn's model spend; no further tool round starts past it

[models]
haiku  = "claude-haiku-5-5"   # voice front end: every turn starts here
sonnet = "claude-sonnet-5-5"  # planner/orchestrator: reached through escalate_to_planner

[spend]
daily_cap_usd = 5.00        # total across tiers; once reached Julius says so and stays on Haiku only (no planner)
offline_at_multiple = 2.0   # at this multiple of the cap Julius says so and switches to the offline model for the rest of the day

[orchestrator]
max_steps = 8               # Sonnet planner tool-loop limit per escalation
subagent_max_steps = 6      # sub-agent tool-loop limit

[research]                  # web research sub-agent (Haiku), dispatched by the planner; read-only, GET only (julius_research.py)
max_steps = 10              # model calls per research task
max_pages = 6               # pages it may open per task
max_usd = 0.10              # hard dollar cap per task; no call is started past it
max_bytes = 500000          # largest page it will read
max_page_chars = 6000       # page text shown to the model
save = true                 # keep the structured result (sources, findings, images) in ~/.julius/research/ for the side panel
keep = 50                   # how many saved results to keep

[vision]                    # one look on request: camera frame, frontmost window, whole screen or a dropped image (julius/agents/vision.py)
camera = true               # "what am I holding", "look at me"; the macOS camera indicator is on only while the picture is taken
screen = true               # "what's on my screen" (frontmost window), "the whole screen"
max_edge = 1568             # pictures are shrunk to this many pixels on the long edge before they are sent
exclude_owners = ["Julius Orb", "Julius"]   # windows of these apps are never the "frontmost window"

[art]                       # art helpers (julius/art/): deterministic image processing only, no generative models; the original is only read
folders = ["~/Julius Art", "~/Pictures", "~/Desktop", "~/Downloads"]   # the ONLY folders an image is taken from by name or path (an image dropped on the orb is always allowed). Folders named like an asset pack, or holding a licence file, are skipped (purchased packs are never touched), and so is anything inside a *.photoslibrary (export or drop those pictures instead)

[music]                     # music helpers (julius/music/): read-only analysis of audio files you name; never Logic, GarageBand, /Library/Audio or plug-in folders
search_folders = ["~/Downloads", "~/Documents", "~/Desktop"]   # where a bare file name is looked for ("what's the BPM of loop.wav")
index_allowlist = [   # the ONLY folders and files the sample index ever scans (your own work); anything not listed is never indexed. A file entry approves that one file only. Read-only; the deny-list still applies
