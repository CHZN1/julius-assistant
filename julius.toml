# Julius runtime configuration. Secrets never go here: put ANTHROPIC_API_KEY in .env (gitignored).

[brain]
mode = "cloud"              # "cloud" (Haiku front end + Sonnet planner) or "local" (Ollama only)

[models]
haiku  = "claude-haiku-5-5"   # voice front end: every turn starts here
sonnet = "claude-sonnet-5-5"  # planner/orchestrator: reached through escalate_to_planner

[spend]
daily_cap_usd = 5.00        # total across tiers; once reached Julius says so and stays on Haiku only (no planner)
offline_at_multiple = 2.0   # at this multiple of the cap Julius says so and switches to the offline model for the rest of the day

[orchestrator]
max_steps = 8               # Sonnet planner tool-loop limit per escalation
subagent_max_steps = 6      # sub-agent tool-loop limit

[research]                  # web research sub-agent (Haiku), dispatched by the planner; read-only, GET only (julius_research.py)
max_steps = 8               # model calls per research task
max_pages = 5               # pages it may open per task
max_usd = 0.10              # hard dollar cap per task; no call is started past it
max_bytes = 500000          # largest page it will read
max_page_chars = 6000       # page text shown to the model
save = true                 # keep the structured result (sources, findings, images) in ~/.julius/research/ for the side panel
keep = 50                   # how many saved results to keep

[offline]
model = "llama3.2:3b"       # loaded only while the API is unreachable
retry_seconds = 60          # how long to stay offline before trying the API again

[voice]
keep_loaded = true          # with the brain in the cloud the TTS voice is never unloaded between turns

[memory]
announce_auto = true             # say "Noted." once after a turn in which Julius saved a fact you stated (they are marked auto in `what do you remember`; say "forget that" to remove one)

[service]
wake_hotkey = "<ctrl>+<alt>+j"   # leaves quiet mode (after "Julius, go to sleep"); also `python -m julius.service.service wake`
log_transcripts = true          # DIAGNOSTICS WINDOW 2026-11-07 to 2026-11-14: the JSON log keeps what you say and what he answers; it switches itself back off after log_transcripts_until
log_transcripts_until = "2026-11-14"   # last day (inclusive); after it transcripts are redacted again with no action from you. Remove the line to keep logging on

[barge_in]
hotkey = "<ctrl>+<alt>+s"      # global stop: silences Julius at once, whatever the microphone hears. macOS asks once to allow input monitoring for the terminal
voice = true                   # spoken stop: speaking over Julius cuts his speech (julius_talkover.py); the hotkey always works

[events]
enabled = true                   # read-only WebSocket on 127.0.0.1 only: state, speaker level (about 30 Hz) and transcript lines for a future UI. `python -m julius.ui_bridge.events_client` prints them
port = 8765

[ui]
enabled = true                   # write channel for the orb app, 127.0.0.1 only, per-install token in ~/.julius/ui_token (docs/UI_CHANNEL.md)
port = 8775
typed_reply = "both"            # text typed in the orb: "both" = he answers aloud and in text, "text" = text only

[audio]
duplex = true                   # DEFAULT since 11-07: one stream for mic + speakers with echo cancellation; the mic gate is off while Julius talks and speaking over him stops him (julius_duplex.py). Falls back to the gate by itself if echo leaks. JULIUS_DUPLEX=0 turns it off for one run
duplex_rate = 48000            # stream rate; his voice plays at full quality, only the mic and the echo reference are reduced to 16 kHz
raw_backfill = false           # true feeds the raw mic for the first words of an interruption (recovers more words but lets Julius's own voice into the transcript); off by request
fallback_seconds = 3.0         # echo leaking through the canceller this long (seconds of playback) puts the mic gate back automatically

[wake]
engine = "cascade"             # "cascade": openWakeWord "Julius" detector -> optional speaker verifier -> Whisper check; "whisper": transcript-regex wake (the fallback)
level_floor = 0.0015           # speech level that counts as the speaker still talking; lower hears quieter and more distant speech (0.0045 missed 65% at 2.5x the distance, 0.0015 missed 3%)
threshold_low = 0.05           # stage-1 detector threshold; low on purpose, Whisper and the verifier reject the false fires
speaker_threshold = 0.25       # personal verifier cut-off (only used when the verifier file below exists)
verifier = "~/.julius/wake_verifier.pkl"   # personal layer trained on your voice by wake/verifier.py; outside the repo, optional

[asr]
vocabulary_hint = true      # Whisper initial_prompt of names/teams: WER 8.0% -> 3.8% on the 20 recorded phrases (AcmeCorp, Example, FER 2013 recognised), +0.03 s; on 10 held-out phrases 7.1% -> 8.3% (one apostrophe, no hallucinated hint words), judged noise. Set false to disable
# vocabulary, nhl_teams and nfl_teams (lists) can be overridden here; defaults live in julius_config.py

[code]
# The Opus coding agent (claude -p in a sandbox). It works on a COPY of a project under projects_root and never pushes; merging back is a separate voice yes.
model = "claude-opus-5-5"
default_cap_usd = 1.50     # per-task spend limit unless you ask for more
max_cap_usd = 5.00         # hard maximum for any single task
timeout_minutes = 20       # a task is stopped after this long
daily_cap_usd = 5.00       # all coding tasks together per day; separate from [spend]
projects_root = "~/dev"    # only folders directly inside this one can be worked on
binary = "claude"

[files.folders]
# What the file agent may do in each folder: "write" (find, read, move, copy, rename, create, trash), "read" (find, list, read only) or "none" (invisible).
# Add a folder by editing this file (absolute path or ~/path); it can never be added by voice or by the model. Restart Julius after editing.
Documents = "write"
Desktop = "write"
Downloads = "write"
"~/dev/sandbox" = "write"   # generated test folder for trying the file agent and the coding agent
