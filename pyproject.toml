[project]
name = "julius"
version = "0.1.0"
description = "A private, voice-first desktop assistant: wake word, streaming speech, tools, memory and sub-agents."
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["emotion", "scripts/experiments", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C90", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]
# The runnable scripts put the repository root on sys.path before importing the package,
# so they work from a plain checkout without `pip install -e .`.
"evals/*" = ["E402"]
"diagnostics/*" = ["E402"]
"benchmarks/*" = ["E402"]
"scripts/*" = ["E402"]
# The speech workers set environment variables (cache dirs, worker mode) before importing mlx/torch.
"julius/audio/mlx_tts_worker.py" = ["E402"]
"julius/audio/tts_worker.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
