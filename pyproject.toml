[project]
name = "julius"
version = "0.1.0"
description = "A private, voice-first desktop assistant: wake word, streaming speech, tools, memory and sub-agents."
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
# What the free unit tests import (the CI job installs these).
test = [
  "numpy", "scipy", "soundfile", "psutil", "requests", "httpx", "pypdf", "reportlab",
  "anthropic", "sounddevice", "livekit", "ollama", "ddgs", "pynput",
  "openwakeword", "mlx-lm", "mlx-whisper", "matplotlib", "pillow", "librosa",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C90", "UP", "SIM", "T20"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM", "T20"]
# print is the interface of the command-line tools and workers; library code writes through julius.log.console.
"evals/*" = ["E402", "T20"]
"diagnostics/*" = ["E402", "T20"]
"scripts/*" = ["E402", "T20"]
"julius/service/*" = ["T20"]
"julius/wake/*" = ["T20"]
"julius/profile.py" = ["T20"]
"julius/models.py" = ["T20"]
"julius/memory/review.py" = ["T20"]
"julius/memory/store.py" = ["T20"]
"julius/ui_bridge/events_client.py" = ["T20"]
"julius/audio/*_worker.py" = ["T20"]
"julius/brain/document_worker.py" = ["T20"]
"julius/log.py" = ["T20"]
# E402 in the runnable tools: they put the repository root on sys.path before importing the package, so they
# work from a plain checkout without `pip install -e .`. The speech workers set environment variables (cache dirs, worker mode) before importing mlx/torch.
"julius/audio/mlx_tts_worker.py" = ["E402"]
"julius/audio/tts_worker.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
